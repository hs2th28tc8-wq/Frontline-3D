 REQ.forEach(id=>{const e=document.createElement('div');e.textContent='✉ '+(NAMES[id]||'Spieler')+' ';e.append(btn('✓',()=>acceptFr(id)),btn('✕',()=>DB.doc('fr/'+ACC.id+'/in/'+id).delete().catch(()=>{})));d.appendChild(e)});
 FR.forEach(id=>{const e=document.createElement('div'),pe=LP.find(p=>p.by===id);e.textContent=(pe?'● ':'○ ')+(NAMES[id]||'Freund')+(pe?' · '+(MAPS[pe.presence.map|0]||{n:'?'}).n:'');if(pe)e.appendChild(btn('Beitreten',()=>{OPT.mode=3;SELMAP=pe.presence.map|0;syncSel()}));d.appendChild(e)})}
$('fs').addEventListener('keydown',async e=>{e.stopPropagation();if(e.key!=='Enter'||!UAPI||!DB)return;const q=$('fs').value.trim();if(!q)return;const r=$('fr2');r.innerHTML='';try{const hits=(await UAPI.search(q)).filter(h=>h.id!==ACC.id).slice(0,4);if(!hits.length)r.textContent='Niemand gefunden';hits.forEach(h=>{const x=document.createElement('div');x.textContent=h.name+' ';x.appendChild(btn('Anfrage',()=>{DB.doc('fr/'+h.id+'/in/'+ACC.id).set({t:Date.now()}).then(()=>{x.textContent='Anfrage gesendet ✓'}).catch(()=>{x.textContent='Nicht erlaubt (Contributor-Rechte nötig)'})}));r.appendChild(x)})}catch(_){r.textContent='Suche nicht verfügbar'}});
function drawBP(){const l=LVL(PROG.xp),d=$('bpl');d.innerHTML='';const h=document.createElement('div');h.textContent='Dein Level: '+l+' · '+PROG.xp+' XP';d.appendChild(h);BP.forEach(([lv,t,pr,sk,ch])=>{const ok=l>=lv&&(!pr||PROG.pass),e=document.createElement('div');e.textContent=(ok?'✔ ':'🔒 ')+'Lv '+lv+' · '+t+(pr?' · PASS':' · gratis')+' ';if(sk!=null){const sw=document.createElement('span');sw.textContent='■ ';sw.style.color=SKD[sk].c===null?'#667':'#'+SKD[sk].c.toString(16).padStart(6,'0');e.insertBefore(sw,e.firstChild);if(ok)e.appendChild(btn(OPT.skin===sk?'Aktiv':'Ausrüsten',()=>{OPT.skin=sk;syncSel();drawBP()}))}if(ch!=null){e.insertBefore(document.createTextNode('👤 '),e.firstChild);if(ok)e.appendChild(btn(OPT.ch===ch?'Aktiv':'Ausrüsten',()=>{OPT.ch=ch;syncSel();drawBP()}))}d.appendChild(e)});$('bpb').textContent=PROG.pass?'Battle Pass aktiv ✔':(ACC&&ACC.admin?'Kostenlos aktivieren (Admin)':'Battle Pass freischalten · 2000 ◆ (du: '+PROG.cr+')');$('bpb').disabled=!!PROG.pass}
$('bpo').onclick=()=>{drawBP();$('bp').style.display='block'};$('bpx').onclick=()=>$('bp').style.display='none';
$('bpb').type='button';
$('bpb').onclick=(ev)=>{
 ev&&ev.preventDefault();
 if(PROG.pass){$('bpb').textContent='Battle Pass bereits aktiv ✔';return}
 const credits=Math.max(0,Number(PROG.cr)||0);
 if(!(ACC&&ACC.admin)&&credits<2000){$('bpb').textContent='Zu wenig Credits · benötigt: 2.000';$('mt').textContent='Dir fehlen noch '+(2000-credits)+' Credits.';return}
 const next={...PROG,cr:(ACC&&ACC.admin)?credits:credits-2000,pass:1};
 try{localStorage.setItem('f3d_prog',JSON.stringify(next));PROG=next;}
 catch(e){$('mt').textContent='Speichern fehlgeschlagen. Bitte Browser-Speicher erlauben.';return}
 rank();syncSel();drawBP();$('mt').textContent='Battle Pass erfolgreich freigeschaltet!';$('bpb').disabled=true;$('bpb').textContent='Battle Pass aktiv ✔';beep(620,980,.22,.12,'sine');
};
rank();syncSel();drawDaily();$('play').disabled=false;$('mt').textContent='Offline-Modus · Fortschritt wird lokal gespeichert';rs();
requestAnimationFrame(loop);
</script>
</body>
